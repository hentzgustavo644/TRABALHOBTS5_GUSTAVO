<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contato | Hentz Eletrônicos</title>
  <!-- Bootstrap 5: CSS (estilos) e JS (menu, dropdown, carrossel e alerta) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>
<!-- CORES: bg-dark fundo escuro, bg-secondary cinza menu, rodapé e cards, text-white texto branco, amarelo text-warning/btn-warning única cor de destaque -->
<body class="bg-dark text-white">

<!-- NAVBAR + DROPDOWN: barra cinza bg-secondary que vira menu hambúrguer no celular navbar-expand-sm -->
<nav class="navbar navbar-expand-sm bg-secondary navbar-dark">
  <div class="container-fluid">
    <a class="navbar-brand text-warning" href="index.html">Hentz Eletrônicos</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="menu">
      <ul class="navbar-nav">
        <li class="nav-item"><a class="nav-link active" href="index.html">Página Inicial</a></li>
        <!-- dropdown: menu suspenso de "Produtos" -->
        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">Produtos</a>
          <ul class="dropdown-menu">
            <li><a class="dropdown-item" href="produtos.html">Notebooks</a></li>
            <li><a class="dropdown-item" href="produtos.html">Teclados</a></li>
            <li><a class="dropdown-item" href="produtos.html">Headsets</a></li>
          </ul>
        </li>
        <li class="nav-item"><a class="nav-link" href="contato.html">Contato</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="container mt-4">
  <h1>Contato</h1>
  <p class="lead">Tire dúvidas, peça orçamentos e receba atendimento especializado.</p>
  <!-- FORMULÁRIO: form-label rótulo, form-control campo de texto, form-select lista, mb-3 espaço abaixo -->
  <form action="#" method="post">
    <div class="mb-3">
      <label for="nome" class="form-label">Nome:</label>
      <input type="text" class="form-control" id="nome">
    </div>
    <div class="mb-3">
      <label for="email" class="form-label">E-mail:</label>
      <input type="email" class="form-control" id="email">
    </div>
    <div class="mb-3">
      <label for="tipo" class="form-label">Categoria de atendimento:</label>
      <select class="form-select" id="tipo">
        <option>Dúvidas</option>
        <option>Orçamentos</option>
        <option>Suporte</option>
      </select>
    </div>
    <div class="mb-3">
      <label for="msg" class="form-label">Mensagem:</label>
      <textarea class="form-control" id="msg" rows="3"></textarea>
    </div>
    <button type="submit" class="btn btn-warning">Enviar</button>
    <button type="reset" class="btn btn-outline-light">Limpar</button>
  </form>
</div>

<!-- RODAPÉ + FLEX: d-flex põe os textos lado a lado, justify-content-between separa nas pontas -->
<footer class="bg-secondary text-white p-4 mt-5">
  <div class="d-flex justify-content-between flex-wrap">
    <p class="mb-0">Hentz Eletrônicos - Rua dos Melhor, nº 22, Santa Barbara, Paraná</p>
    <p class="mb-0">gustavo@gmail.com | &copy;2026</p>
  </div>
</footer>

</body>
</html>
